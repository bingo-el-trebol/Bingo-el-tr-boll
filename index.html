<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>🍀 BINGO EL TRÉBOL</title>
<style>
:root{--bg:#090a09;--panel:#121512;--green:#6f8f62;--green2:#9bb48c;--cream:#efe6d3;--line:#a89b78}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1a2119 0,#090a09 42%,#050505 100%);color:var(--cream);font-family:Georgia,'Times New Roman',serif}
main{width:min(1100px,100%);margin:auto;padding:28px 16px 42px}.hero{text-align:center;margin-bottom:24px}.clover{font-size:32px}.hero h1{margin:4px 0 8px;font-size:clamp(27px,6vw,46px);letter-spacing:2px}.hero p{margin:0;color:#cfc7b4;font-size:16px}
.search{position:sticky;top:0;z-index:5;background:rgba(9,10,9,.94);backdrop-filter:blur(8px);padding:10px 0 14px}.search label{display:block;text-align:center;font-size:18px;margin-bottom:9px}.search input{display:block;width:min(520px,100%);margin:auto;padding:14px 16px;border-radius:12px;border:1px solid #5c654f;background:#11140f;color:white;font-size:18px;outline:none}.search input:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(155,180,140,.13)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:16px}.card-btn{appearance:none;border:1px solid #665f4d;background:linear-gradient(145deg,#191c17,#0f100e);color:var(--cream);border-radius:11px;padding:13px 8px;font:600 15px Georgia,serif;cursor:pointer;transition:.15s}.card-btn:hover,.card-btn:focus{border-color:var(--green2);transform:translateY(-1px);outline:none}.empty{text-align:center;padding:28px;color:#c7c0b0}
.viewer{display:none;text-align:center}.viewer.active{display:block}.listing.hidden{display:none}.viewer h2{font-size:25px;letter-spacing:1px;margin:8px 0 18px}.image-wrap{width:min(900px,100%);margin:auto;background:#050505;border:1px solid #655e4d;border-radius:12px;padding:8px;box-shadow:0 12px 40px rgba(0,0,0,.4)}.image-wrap img{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain;margin:auto}.back{margin-top:18px;padding:12px 20px;border:1px solid #77705c;border-radius:10px;background:#161912;color:var(--cream);font:600 16px Georgia,serif;cursor:pointer}.back:hover{border-color:var(--green2)}
footer{text-align:center;color:#8f897c;font-size:13px;margin-top:28px}
@media(max-width:520px){main{padding:20px 12px 34px}.grid{grid-template-columns:repeat(3,1fr);gap:8px}.card-btn{padding:12px 4px;font-size:13px}.image-wrap{padding:4px;border-radius:8px}.viewer h2{font-size:21px}}
</style>
</head>
<body>
<main>
<section class="hero"><div class="clover">🍀</div><h1>BINGO EL TRÉBOL</h1><p>Encuentra y consulta tu cartón</p></section>
<section id="listing" class="listing">
<div class="search"><label for="search">Selecciona tu número de cartón</label><input id="search" type="search" inputmode="numeric" autocomplete="off" placeholder="Escribe un número, por ejemplo 127" aria-label="Buscar cartón"></div>
<div id="grid" class="grid" aria-live="polite"></div><div id="empty" class="empty" hidden>No encontramos cartones con ese número.</div>
</section>
<section id="viewer" class="viewer" aria-live="polite"><h2 id="viewerTitle"></h2><div class="image-wrap"><img id="cardImage" alt="Cartón de bingo"></div><button class="back" id="back" type="button">← Volver a los cartones</button></section>
<footer>🍀 Bingo El Trébol</footer>
</main>
<script>
const TOTAL=300;
const grid=document.getElementById('grid'), search=document.getElementById('search'), empty=document.getElementById('empty');
const listing=document.getElementById('listing'), viewer=document.getElementById('viewer'), title=document.getElementById('viewerTitle'), img=document.getElementById('cardImage'), back=document.getElementById('back');
function pad(n){return String(n).padStart(3,'0')}
function showList(filter=''){
  const q=filter.trim(); grid.innerHTML=''; let count=0;
  for(let n=1;n<=TOTAL;n++){ if(q && !String(n).includes(q)) continue; count++; const b=document.createElement('button'); b.type='button'; b.className='card-btn'; b.textContent='Cartón '+pad(n); b.dataset.card=n; b.addEventListener('click',()=>showCard(n)); grid.appendChild(b); }
  empty.hidden=count!==0;
}
function showCard(n){
  const id=pad(n); title.textContent='CARTÓN '+id; img.src='cartones/Carton_'+id+'.png'; img.alt='Cartón '+id+' de Bingo El Trébol';
  listing.classList.add('hidden'); viewer.classList.add('active'); window.scrollTo({top:0,behavior:'smooth'}); history.pushState({card:n},'', '#carton-'+id);
}
function showListing(){viewer.classList.remove('active');listing.classList.remove('hidden');showList(search.value);window.scrollTo({top:0,behavior:'smooth'});if(location.hash)history.pushState({},'',location.pathname+location.search)}
search.addEventListener('input',e=>showList(e.target.value));back.addEventListener('click',showListing);
window.addEventListener('popstate',()=>{const m=location.hash.match(/^#carton-(\d{3})$/);if(m&&+m[1]>=1&&+m[1]<=TOTAL)showCard(+m[1]);else showListing()});
const initial=location.hash.match(/^#carton-(\d{3})$/); if(initial&&+initial[1]>=1&&+initial[1]<=TOTAL)showCard(+initial[1]); else showList();
</script>
</body></html>
